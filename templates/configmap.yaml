apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-configmap" $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application.yaml: |
    server:
      port: {{ .Values.service.targetPort }}
    management:
      endpoints:
        web:
          exposure:
            include: "health,info,metrics,prometheus"
      endpoint:
        health:
          probes:
            enabled: true
            show-details: always
    spring:
      application:
        name: {{ .Release.Name }}
