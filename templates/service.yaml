{{- /* krateo:gate begin — generated from architecture.yaml; edit the descriptor, not this block. */}}
{{- $gate := true -}}
{{- $dep0 := lookup "apps/v1" "Deployment" $.Release.Namespace (printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-") -}}
{{- if not (and $dep0 (dig "status" "availableReplicas" "" $dep0)) -}}{{- $gate = false -}}{{- end -}}
{{- if $gate }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-service" $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- /* krateo:gate end */}}
