{{- if .Values.ingress.enabled }}
{{- /* krateo:gate begin — generated from architecture.yaml; edit the descriptor, not this block. */}}
{{- $gate := true -}}
{{- $dep0 := lookup "v1" "Service" $.Release.Namespace (printf "%s-service" $.Release.Name | trunc 63 | trimSuffix "-") -}}
{{- if not $dep0 -}}{{- $gate = false -}}{{- end -}}
{{- if $gate }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-ingress" $.Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ printf "%s-deployment" $.Release.Name | trunc 63 | trimSuffix "-" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType | quote }}
            backend:
              service:
                name: {{ printf "%s-service" $.Release.Name | trunc 63 | trimSuffix "-" }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- /* krateo:gate end */}}
{{- end }}
